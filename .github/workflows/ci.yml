name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.data-structure }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data-structure: [binarysearchtree, hashtable, redblacktree, sparse]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Init submodules
        run: |
          git submodule update --init --remote
          git add .
          git config --global user.email "kavyanem999@gmail.com"
          git config --global user.name "Kavya Nemavat"
          git commit -m "Update submodule pointer to latest commit"
          git push
      - name: Install toolchain (valgrind, bc, GNU time)
        run: |
          sudo apt-get install -y --no-install-recommends valgrind bc time
      - name: Build & test ${{ matrix.data-structure }}
        run: |
          cd ${{ matrix.data-structure }}
          chmod +x  ./../low-latency-data-structures-tests/${{ matrix.data-structure }}/main.sh
          ./../low-latency-data-structures-tests/${{ matrix.data-structure }}/main.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.data-structure }}
          path: |
            ${{ matrix.data-structure }}/*.txt
